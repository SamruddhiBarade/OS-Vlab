    // -------------------------------------------------------------
    // MAIN APP COMPONENT
    // -------------------------------------------------------------
    function App() {
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('os_virtlab_user_v1');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return null;
      });

      const [currentModuleId, setCurrentModuleId] = useState(null); // null = Dashboard
      const [currentStep, setCurrentStep] = useState(1);
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [showGraduation, setShowGraduation] = useState(false);
      const [showBadgeModal, setShowBadgeModal] = useState(false);
      const [studentName, setStudentName] = useState(() => user ? user.name : 'Alex Morgan');
      const [taskModal, setTaskModal] = useState(null); // { stepName, onNext }
      const [toast, setToast] = useState(null); // { message, type }

      const handleLogin = (userData) => {
        setUser(userData);
        setStudentName(userData.name);
        localStorage.setItem('os_virtlab_user_v1', JSON.stringify(userData));
        showNotification(`👋 Welcome ${userData.name}! Logged into OS Virtual Lab.`);
      };

      const handleLogout = () => {
        setUser(null);
        localStorage.removeItem('os_virtlab_user_v1');
      };

      const [progress, setProgress] = useState(() => {
        const saved = localStorage.getItem('os_virtlab_prog_v6');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        const init = {};
        MODULES_DATA.forEach(m => {
          init[m.id] = { learn: false, animation: false, task: false, terminal: false, quiz: false, completed: false, quizScore: 0 };
        });
        return init;
      });

      useEffect(() => {
        localStorage.setItem('os_virtlab_prog_v6', JSON.stringify(progress));
      }, [progress]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const showNotification = (msg, type = 'success') => {
        setToast({ message: msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      const markStepComplete = (modId, stepName) => {
        setProgress(prev => {
          const mod = prev[modId] || { learn: false, animation: false, task: false, terminal: false, quiz: false, completed: false, quizScore: 0 };
          const updated = { ...mod, [stepName]: true };
          updated.completed = updated.learn && updated.animation && updated.task && updated.terminal && updated.quiz;
          const nextProg = { ...prev, [modId]: updated };

          const doneCount = Object.values(nextProg).filter(m => m.completed).length;
          if (doneCount >= 10 && !showGraduation) {
            setShowGraduation(true);
            try { confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } }); } catch (e) {}
          }

          return nextProg;
        });

        const activeMod = MODULES_DATA.find(m => m.id === modId);
        showNotification(`⚡ Progress Updated: ${activeMod ? activeMod.title : 'Module'} ${stepName.toUpperCase()} Verified!`);
      };

      const setQuizScore = (modId, score) => {
        setProgress(prev => {
          const mod = prev[modId] || {};
          const updated = { ...mod, quiz: true, quizScore: score };
          updated.completed = updated.learn && updated.animation && updated.task && updated.terminal && updated.quiz;
          const nextProg = { ...prev, [modId]: updated };

          const doneCount = Object.values(nextProg).filter(m => m.completed).length;
          if (doneCount >= 10) setShowGraduation(true);
          return nextProg;
        });
        showNotification(`🎉 Quiz Submitted & Verified! Score: ${score}%`);
      };

      const getModulePercent = (modId) => {
        const m = progress[modId];
        if (!m) return 0;
        const done = [m.learn, m.animation, m.task, m.terminal, m.quiz].filter(Boolean).length;
        return Math.round((done / 5) * 100);
      };

      const getOverallPercent = () => {
        const sum = MODULES_DATA.reduce((acc, m) => acc + getModulePercent(m.id), 0);
        return Math.round(sum / MODULES_DATA.length);
      };

      const handleStepDoneWithPopup = (modId, stepName, stepNum) => {
        markStepComplete(modId, stepName);
        setTaskModal({
          stepName: stepName.toUpperCase(),
          onNext: () => {
            setTaskModal(null);
            if (stepNum < 6) setCurrentStep(stepNum + 1);
          }
        });
      };

      const activeModule = MODULES_DATA.find(m => m.id === currentModuleId);

      // Render Login Screen if not logged in
      if (!user) {
        return <LoginView onLogin={handleLogin} />;
      }

      return (
        <div className="min-h-screen flex flex-col bg-[#fdf6e2] relative">
          {/* Top Header */}
          <header className="h-16 border-b-2 border-[#701a75] bg-white sticky top-0 z-30 flex items-center justify-between px-4 sm:px-6 shadow-sm">
            <div className="flex items-center gap-3">
              <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-2 text-[#701a75] hover:bg-[#f3e8ff] rounded-xl md:hidden">
                <i data-lucide="menu" className="w-5 h-5"></i>
              </button>
              <div onClick={() => setCurrentModuleId(null)} className="flex items-center gap-2.5 cursor-pointer group">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#701a75] to-[#ec4899] flex items-center justify-center text-white font-bold shadow-md group-hover:scale-105 transition">
                  <i data-lucide="cpu" className="w-5 h-5"></i>
                </div>
                <div>
                  <span className="font-black text-base tracking-tight text-[#701a75] flex items-center gap-2">
                    OS Virtual Lab <span className="text-[10px] font-mono bg-[#f3e8ff] text-[#701a75] border border-[#701a75] px-2 py-0.5 rounded-full font-bold">v6.0</span>
                  </span>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <div className="hidden lg:flex items-center gap-2 px-3 py-1 rounded-full bg-[#f3e8ff] border border-[#701a75] text-[#701a75] text-xs font-black">
                <span>👨‍🎓 {user.name} ({user.rollNo})</span>
                <button onClick={handleLogout} className="text-[10px] bg-[#701a75] text-white px-2 py-0.5 rounded-full hover:bg-red-600 transition ml-1">
                  Logout
                </button>
              </div>

              <button
                onClick={() => setShowBadgeModal(true)}
                className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-[#f3e8ff] border-2 border-[#701a75] text-[#701a75] text-xs font-black hover:scale-105 transition shadow-sm"
              >
                🏆 Badges
              </button>

              <div className="hidden sm:flex items-center gap-3 bg-[#fdf6e2] border-2 border-[#78350f]/20 px-4 py-1.5 rounded-full text-xs font-mono">
                <span className="text-[#78350f] font-extrabold">Overall Progress: <strong className="text-[#701a75]">{getOverallPercent()}%</strong></span>
                <div className="w-24 bg-white border border-[#78350f]/20 h-2.5 rounded-full overflow-hidden">
                  <div className="bg-gradient-to-r from-[#f59e0b] via-[#ec4899] to-[#7e22ce] h-full transition-all duration-500" style={{ width: `${getOverallPercent()}%` }}></div>
                </div>
              </div>

              <button
                onClick={() => {
                  if (getOverallPercent() >= 100) {
                    setShowGraduation(true);
                  } else {
                    showNotification(`🔒 Certificate Locked! You must complete all 10 modules (100% course progress) to generate your certificate. Current progress: ${getOverallPercent()}%`, 'error');
                  }
                }}
                className={`flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-black shadow-md transition ${
                  getOverallPercent() >= 100
                    ? 'bg-gradient-to-r from-[#f59e0b] to-[#ec4899] text-white hover:scale-105 cursor-pointer'
                    : 'bg-gray-200 text-gray-500 border border-gray-300 opacity-70 cursor-not-allowed'
                }`}
              >
                {getOverallPercent() >= 100 ? '🎓 Certificate' : '🔒 Certificate (Locked)'}
              </button>
            </div>
          </header>

          <div className="flex-1 flex max-w-7xl w-full mx-auto">
            {/* Sidebar Navigation */}
            <aside className={`fixed md:sticky top-16 h-[calc(100vh-4rem)] w-72 bg-white border-r-2 border-[#701a75] flex flex-col z-40 transition-transform ${
              sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'
            }`}>
              <div className="p-4 flex-1 overflow-y-auto space-y-3">
                <button
                  onClick={() => { setCurrentModuleId(null); setSidebarOpen(false); }}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-black transition border-2 ${
                    currentModuleId === null ? 'bg-[#701a75] text-white border-[#701a75] shadow-md' : 'text-[#701a75] border-transparent hover:bg-[#f3e8ff]'
                  }`}
                >
                  <i data-lucide="layout-dashboard" className="w-4 h-4"></i> Main Dashboard
                </button>

                <div className="pt-2">
                  <div className="text-[11px] font-mono uppercase text-[#78350f] font-black px-3 mb-2 tracking-wider">10 OS Modules</div>
                  <div className="space-y-1.5">
                    {MODULES_DATA.map(m => {
                      const pct = getModulePercent(m.id);
                      const isDone = progress[m.id]?.completed;
                      const isActive = currentModuleId === m.id;

                      return (
                        <button
                          key={m.id}
                          onClick={() => { setCurrentModuleId(m.id); setCurrentStep(1); setSidebarOpen(false); }}
                          className={`w-full flex items-center justify-between p-2.5 rounded-xl text-xs font-extrabold transition-all duration-300 hover:shadow-lg hover:scale-[1.02] border-2 ${
                            isActive ? 'bg-[#f3e8ff] border-[#701a75] text-[#701a75]' : 'text-[#3b0764] border-transparent hover:bg-[#fdf6e2]'
                          }`}
                        >
                          <div className="flex items-center gap-2.5 truncate">
                            <i data-lucide={m.icon} className="w-4 h-4 shrink-0 text-[#701a75]"></i>
                            <span className="truncate">{m.title}</span>
                          </div>
                          <span className={`font-mono text-[10px] px-2 py-0.5 rounded-full font-black ${isDone ? 'bg-[#059669]/10 text-[#059669] border border-[#059669]' : 'bg-[#fdf6e2] text-[#78350f]'}`}>
                            {isDone ? '✓' : `${pct}%`}
                          </span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            </aside>

            {/* Main Content Area */}
            <main className="flex-1 p-4 sm:p-8">
              {currentModuleId === null ? (
                <DashboardView
                  modules={MODULES_DATA}
                  progress={progress}
                  getModulePercent={getModulePercent}
                  getOverallPercent={getOverallPercent}
                  onSelectModule={(id) => { setCurrentModuleId(id); setCurrentStep(1); }}
                  onOpenBadges={() => setShowBadgeModal(true)}
                />
              ) : (
                <TopicPageView
                  moduleData={activeModule}
                  currentStep={currentStep}
                  setCurrentStep={setCurrentStep}
                  progress={progress}
                  getModulePercent={getModulePercent}
                  markStepComplete={markStepComplete}
                  handleStepDoneWithPopup={handleStepDoneWithPopup}
                  setQuizScore={setQuizScore}
                  onBackToDashboard={() => setCurrentModuleId(null)}
                  showNotification={showNotification}
                />
              )}
            </main>
          </div>

          {/* Persistent Floating Corner Badge Button */}
          <button
            onClick={() => setShowBadgeModal(true)}
            className="fixed bottom-5 right-5 z-40 px-4 py-3 bg-gradient-to-r from-[#701a75] to-[#ec4899] text-white font-black text-xs rounded-full shadow-2xl hover:scale-110 transition flex items-center gap-2 border-2 border-white animate-float"
          >
            <span>🏆 View Badges</span>
          </button>

          {/* Floating Toast Notification */}
          {toast && (
            <div className="fixed top-20 right-6 z-50 animate-slide-up">
              <div className={`px-5 py-3.5 rounded-2xl shadow-2xl border-2 font-black text-xs flex items-center gap-3 ${
                toast.type === 'error' ? 'bg-[#ef4444] text-white border-red-700' : 'bg-[#701a75] text-white border-purple-900'
              }`}>
                <span>{toast.message}</span>
              </div>
            </div>
          )}

          {/* Task Completed Animated Popup Modal */}
          {taskModal && (
            <div className="fixed inset-0 bg-[#3b0764]/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white border-4 border-[#f59e0b] p-8 rounded-3xl max-w-md w-full text-center space-y-5 shadow-2xl animate-slide-up">
                <div className="w-16 h-16 bg-gradient-to-tr from-[#f59e0b] to-[#ec4899] rounded-full mx-auto flex items-center justify-center text-3xl shadow-lg">
                  🎉
                </div>
                <div>
                  <div className="text-xs font-black text-[#701a75] uppercase tracking-wider">Step Completed</div>
                  <h2 className="text-2xl font-black text-[#3b0764] mt-1">🎉 Task Completed!</h2>
                  <p className="text-xs text-[#78350f] font-extrabold mt-2">
                    Great job! You have successfully completed the <strong>{taskModal.stepName}</strong> section.
                  </p>
                </div>
                <button
                  onClick={taskModal.onNext}
                  className="w-full py-3.5 bg-gradient-to-r from-[#701a75] to-[#7e22ce] text-white font-black text-sm rounded-2xl shadow-lg hover:scale-105 transition"
                >
                  Next Task ➔
                </button>
              </div>
            </div>
          )}

          {/* Badges Modal */}
          {showBadgeModal && (
            <div className="fixed inset-0 bg-[#3b0764]/75 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-white border-4 border-[#701a75] p-6 sm:p-8 rounded-3xl max-w-xl w-full space-y-6 shadow-2xl relative">
                <button onClick={() => setShowBadgeModal(false)} className="absolute top-4 right-4 text-[#701a75] font-black text-xl hover:scale-110">✕</button>
                <div className="text-center">
                  <div className="text-4xl">🏆</div>
                  <h2 className="text-2xl font-black text-[#3b0764] mt-1">OS Lab Achievements & Badges</h2>
                  <p className="text-xs text-[#78350f] font-bold mt-1">Track your verified virtual lab credentials</p>
                </div>

                <div className="space-y-3">
                  {ACHIEVEMENTS.map(ach => {
                    const overall = getOverallPercent();
                    let unlocked = false;
                    if (ach.id === 'first_step' && overall > 0) unlocked = true;
                    if (ach.id === 'scholar' && overall >= 50) unlocked = true;
                    if (ach.id === 'master' && overall >= 100) unlocked = true;

                    return (
                      <div key={ach.id} className={`p-4 rounded-2xl border-2 flex items-center gap-4 transition ${
                        unlocked ? 'bg-[#f3e8ff] border-[#701a75] text-[#701a75]' : 'bg-[#fdf6e2] border-[#78350f]/20 text-[#78350f] opacity-60'
                      }`}>
                        <div className="text-3xl">{unlocked ? '🏅' : '🔒'}</div>

    // -------------------------------------------------------------
    // TOPIC PAGE VIEW (6-STEP FLOW WITH PREVIOUS/NEXT TASK NAVIGATION & LOCKS)
    // -------------------------------------------------------------
    function TopicPageView({ moduleData, currentStep, setCurrentStep, progress, getModulePercent, markStepComplete, handleStepDoneWithPopup, setQuizScore, onBackToDashboard, showNotification }) {
      const pct = getModulePercent(moduleData.id);
      const modProgress = progress[moduleData.id] || {};

      const steps = [
        { id: 1, name: 'learn', label: 'Step 1: Learn' },
        { id: 2, name: 'animation', label: 'Step 2: Animation' },
        { id: 3, name: 'task', label: 'Step 3: Task' },
        { id: 4, name: 'terminal', label: 'Step 4: CLI Shell' },
        { id: 5, name: 'quiz', label: 'Step 5: Quiz' },
        { id: 6, name: 'completed', label: 'Step 6: Completed' }
      ];

      const handleStepClick = (targetStepId) => {
        if (targetStepId === 1) {
          setCurrentStep(1);
          return;
        }

        const prevStepName = steps[targetStepId - 2]?.name;
        if (modProgress[prevStepName] || targetStepId <= currentStep) {
          setCurrentStep(targetStepId);
        } else {
          showNotification(`⚠️ Step Locked! Please complete Step ${targetStepId - 1} before skipping ahead.`, 'error');
        }
      };

      const handleNextTask = () => {
        if (currentStep >= 6) return;
        const currentStepName = steps[currentStep - 1]?.name;
        if (modProgress[currentStepName] || currentStep === 1) {
          setCurrentStep(currentStep + 1);
        } else {
          showNotification(`⚠️ Step Locked! Please finish the current activity to advance.`, 'error');
        }
      };

      const handlePrevTask = () => {
        if (currentStep > 1) {
          setCurrentStep(currentStep - 1);
        }
      };

      return (
        <div className="space-y-6 pb-12 animate-slide-up">
          {/* Breadcrumb Header */}
          <div className="flex items-center justify-between text-xs font-mono font-black">
            <button onClick={onBackToDashboard} className="text-[#701a75] hover:underline flex items-center gap-2">
              ← Back to Dashboard
            </button>
            <span className="text-[#701a75] bg-white border border-[#701a75] px-3 py-1 rounded-full">{pct}% Completed</span>
          </div>

          {/* Module Banner */}
          <div className="bg-white border-3 border-[#701a75] p-6 rounded-3xl space-y-2 shadow-sm">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div>
                <h1 className="text-2xl font-black text-[#3b0764]">Module {moduleData.num}: {moduleData.title}</h1>
                <p className="text-[#78350f] text-xs mt-1 font-bold">{moduleData.shortDesc}</p>
              </div>
              {modProgress.completed && (
                <span className="px-4 py-1.5 rounded-full bg-[#059669]/10 border border-[#059669] text-[#059669] text-xs font-mono font-black">
                  ✓ Module Fully Completed
                </span>
              )}
            </div>
          </div>

          {/* 6-Step Timeline Header */}
          <div className="bg-white border-2 border-[#701a75] p-2 rounded-2xl overflow-x-auto shadow-sm">
            <div className="flex items-center min-w-[650px] justify-between">
              {steps.map(step => {
                const isCurrent = currentStep === step.id;
                const isDone = modProgress[step.name];
                const prevDone = step.id === 1 || modProgress[steps[step.id - 2]?.name];

                return (
                  <button
                    key={step.id}
                    onClick={() => handleStepClick(step.id)}
                    className={`flex-1 px-3 py-2.5 rounded-xl text-xs font-black transition text-center flex items-center justify-center gap-1.5 ${
                      isCurrent
                        ? 'bg-[#701a75] text-white shadow-md'
                        : isDone
                        ? 'text-[#059669] hover:bg-[#f3e8ff]'
                        : prevDone
                        ? 'text-[#78350f] hover:bg-[#fdf6e2]'
                        : 'text-gray-400 cursor-not-allowed opacity-60'
                    }`}
                  >
                    <span>{step.label}</span>
                    {isDone ? '✓' : !prevDone ? '🔒' : ''}
                  </button>
                );
              })}
            </div>
          </div>

          {/* Dynamic Step Content */}
          <div className="min-h-[400px]">
            {currentStep === 1 && <LearnStep moduleData={moduleData} onDone={() => handleStepDoneWithPopup(moduleData.id, 'learn', 1)} />}
            {currentStep === 2 && <AnimationStep moduleId={moduleData.id} onDone={() => handleStepDoneWithPopup(moduleData.id, 'animation', 2)} />}
            {currentStep === 3 && <TaskStep moduleData={moduleData} onDone={() => handleStepDoneWithPopup(moduleData.id, 'task', 3)} />}
            {currentStep === 4 && <TerminalStep moduleId={moduleData.id} onDone={() => handleStepDoneWithPopup(moduleData.id, 'terminal', 4)} />}
            {currentStep === 5 && <QuizStep moduleData={moduleData} setQuizScore={setQuizScore} onDone={() => handleStepDoneWithPopup(moduleData.id, 'quiz', 5)} />}
            {currentStep === 6 && <CompletedStep moduleData={moduleData} onDashboard={onBackToDashboard} />}
          </div>

          {/* Previous & Next Task Navigation Bar */}
          <div className="bg-white border-2 border-[#701a75] p-3 rounded-2xl flex items-center justify-between shadow-sm font-mono text-xs">
            <button
              onClick={handlePrevTask}
              disabled={currentStep <= 1}
              className="px-4 py-2.5 rounded-xl bg-[#fdf6e2] border-2 border-[#78350f]/20 text-[#78350f] font-black hover:bg-[#f3e8ff] disabled:opacity-40 transition"
            >
              ← Previous Step
            </button>
            <span className="font-black text-[#701a75]">
              Step {currentStep} of 6
            </span>
            <button
              onClick={handleNextTask}
              disabled={currentStep >= 6}
              className="px-4 py-2.5 rounded-xl bg-[#701a75] text-white font-black hover:scale-105 disabled:opacity-40 transition shadow-sm"
            >
              Next Step ➔
            </button>
          </div>
        </div>
      );
    }

    // 1. Process Management Simulator
    function ProcessSim() {
      const [procs, setProcs] = useState([
        { id: 'P1', state: 'Ready', priority: 'High', pid: 101 },
        { id: 'P2', state: 'Running', priority: 'Medium', pid: 102 },
        { id: 'P3', state: 'Waiting', priority: 'Low', pid: 103 }
      ]);
      const [newProcName, setNewProcName] = useState('P4');
      const states = ['New', 'Ready', 'Running', 'Waiting', 'Terminated'];

      const addProcess = () => {
        if (!newProcName.trim()) return;
        setProcs([...procs, { id: newProcName.trim(), state: 'New', priority: 'Medium', pid: 100 + procs.length + 1 }]);
        setNewProcName(`P${procs.length + 2}`);
      };

      const moveState = (id, targetState) => {
        setProcs(procs.map(p => p.id === id ? { ...p, state: targetState } : p));
      };

      return (
        <div className="bg-white border-2 border-[#701a75] p-5 rounded-2xl space-y-5 font-mono text-xs shadow-sm">
          <div className="flex flex-wrap items-center justify-between gap-3 bg-[#fdf6e2] border-2 border-[#78350f]/20 p-3 rounded-xl">
            <div className="flex items-center gap-2">
              <span className="text-[#78350f] font-black">Add Process:</span>
              <input type="text" value={newProcName} onChange={e => setNewProcName(e.target.value)} className="w-20 bg-white border border-[#701a75] px-2 py-1 rounded font-black text-[#701a75]" />
              <button onClick={addProcess} className="px-3 py-1 bg-[#701a75] text-white font-black rounded-lg hover:scale-105 transition">+ Add</button>
            </div>
            <div className="text-[11px] text-[#78350f] font-bold">Tip: Click state action buttons below to transition processes</div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-5 gap-3">
            {states.map(s => {
              const list = procs.filter(p => p.state === s);
              return (
                <div key={s} className="bg-white border-2 border-[#701a75]/30 p-3 rounded-2xl min-h-[220px] flex flex-col justify-between shadow-sm">
                  <div>
                    <div className="font-black text-xs text-[#701a75] border-b-2 border-[#701a75]/20 pb-2 mb-2 flex justify-between">
                      <span>{s}</span>
                      <span className="font-mono text-[#ec4899] bg-[#f3e8ff] px-2 py-0.5 rounded-full">{list.length}</span>
                    </div>
                    <div className="space-y-2">
                      {list.map(p => (
                        <div key={p.id} className="bg-[#fdf6e2] p-2.5 rounded-xl border border-[#78350f]/20 font-black space-y-1.5 shadow-sm">
                          <div className="flex justify-between text-[#3b0764]">
                            <span>{p.id} (PID {p.pid})</span>
                            <span className="text-[10px] text-[#701a75]">{p.priority}</span>
                          </div>
                          {s === 'New' && (
                            <button onClick={() => moveState(p.id, 'Ready')} className="w-full py-1 bg-[#701a75] text-white text-[10px] font-black rounded">Admit to Ready ➔</button>
                          )}
                          {s === 'Ready' && (
                            <button onClick={() => moveState(p.id, 'Running')} className="w-full py-1 bg-[#059669] text-white text-[10px] font-black rounded">Dispatch CPU ➔</button>
                          )}
                          {s === 'Running' && (
                            <div className="space-y-1">
                              <button onClick={() => moveState(p.id, 'Waiting')} className="w-full py-1 bg-[#f59e0b] text-white text-[10px] font-black rounded">I/O Request ➔</button>
                              <button onClick={() => moveState(p.id, 'Terminated')} className="w-full py-1 bg-[#ef4444] text-white text-[10px] font-black rounded">Exit / Terminate ➔</button>
                            </div>
                          )}
                          {s === 'Waiting' && (
                            <button onClick={() => moveState(p.id, 'Ready')} className="w-full py-1 bg-[#701a75] text-white text-[10px] font-black rounded">I/O Done ➔ Ready</button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // 2. CPU Scheduling Simulator
    function CpuSim() {
      const [algo, setAlgo] = useState('FCFS');
      const [tq, setTq] = useState(2);
      const [speedMult, setSpeedMult] = useState(1);
      const [procs, setProcs] = useState([
        { id: 'P1', burst: 6, arrival: 0 },
        { id: 'P2', burst: 4, arrival: 1 },
        { id: 'P3', burst: 8, arrival: 2 }
      ]);
      const [step, setStep] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);

      useEffect(() => {
        let timer;
        const total = procs.reduce((acc, p) => acc + p.burst, 0);
        if (isPlaying && step < total) {
          timer = setTimeout(() => setStep(prev => prev + 1), 600 / speedMult);
        } else if (step >= total) {
          setIsPlaying(false);
        }
        return () => clearTimeout(timer);
      }, [isPlaying, step, speedMult, procs]);

      const totalBurst = procs.reduce((acc, p) => acc + p.burst, 0);

      return (
        <div className="bg-white border-2 border-[#701a75] p-5 rounded-2xl space-y-4 font-mono text-xs shadow-sm">
          {/* Controls Bar */}
          <div className="flex flex-wrap items-center justify-between gap-3 bg-[#fdf6e2] border border-[#701a75]/30 p-3 rounded-xl">
            <div className="flex items-center gap-3">
              <span className="text-[#78350f] font-black">Algorithm:</span>
              <select value={algo} onChange={e => { setAlgo(e.target.value); setStep(0); }} className="bg-white border border-[#701a75] text-[#701a75] p-1.5 rounded-xl font-black">
                <option value="FCFS">FCFS (First-Come First-Served)</option>
                <option value="SJF">SJF (Shortest Job First)</option>
                <option value="RR">Round Robin (RR)</option>
              </select>
              {algo === 'RR' && (
                <div className="flex items-center gap-1">
                  <span className="text-[#78350f] font-black">Quantum (Q):</span>
                  <input type="number" min="1" max="5" value={tq} onChange={e => setTq(Number(e.target.value))} className="w-12 bg-white border border-[#701a75] p-1 rounded font-black text-[#701a75]" />
                </div>
              )}
            </div>

            <div className="flex items-center gap-2">
              <span className="text-[#78350f] font-black">Speed:</span>
              <select value={speedMult} onChange={e => setSpeedMult(Number(e.target.value))} className="bg-white border border-[#701a75] text-[#701a75] p-1 rounded font-black">
                <option value={0.5}>0.5x</option>
                <option value={1}>1.0x</option>
                <option value={2}>2.0x</option>
              </select>
              <button onClick={() => setIsPlaying(!isPlaying)} className="px-3.5 py-1.5 bg-[#701a75] text-white font-black rounded-xl hover:scale-105 transition">
                {isPlaying ? '⏸ Pause' : '▶ Play'}
              </button>
              <button onClick={() => setStep(prev => Math.min(prev + 1, totalBurst))} className="px-3 py-1.5 bg-[#ec4899] text-white font-black rounded-xl hover:scale-105 transition">
                ⏭ Step
              </button>
              <button onClick={() => { setStep(0); setIsPlaying(false); }} className="px-3 py-1.5 bg-[#fdf6e2] border border-[#78350f] text-[#78350f] font-black rounded-xl">
                ↺ Reset
              </button>
            </div>
          </div>

          {/* Custom Student Input Fields */}
          <div className="grid grid-cols-3 gap-2 bg-white border border-[#701a75]/20 p-3 rounded-xl">
            {procs.map((p, idx) => (
              <div key={p.id} className="space-y-1">
                <label className="text-[#701a75] font-black">{p.id} Burst (ms):</label>
                <input
                  type="number"
                  min="1"
                  max="20"
                  value={p.burst}
                  onChange={e => {
                    const next = [...procs];
                    next[idx].burst = Math.max(1, Number(e.target.value));
                    setProcs(next);
                    setStep(0);
                  }}
                  className="w-full bg-[#fdf6e2] border border-[#701a75] p-1.5 rounded-xl font-black text-[#701a75]"
                />
              </div>
            ))}
          </div>

          {/* Animated Gantt Timeline */}
          <div className="space-y-2">
            <div className="flex items-center justify-between">
              <span className="text-[#78350f] font-black">Animated CPU Gantt Progress (Time t = {step} ms):</span>
              <span className="text-[#059669] font-black">Total Duration: {totalBurst} ms</span>
            </div>
            <div className="flex border-2 border-[#701a75] rounded-xl h-14 overflow-hidden text-center text-white font-black shadow-inner">
              <div style={{ width: `${(procs[0].burst/totalBurst)*100}%` }} className={`border-r border-white flex flex-col items-center justify-center transition-all ${step >= procs[0].burst ? 'bg-[#701a75]' : 'bg-[#701a75]/40 opacity-70'}`}>
                <span>{procs[0].id}</span>
                <span className="text-[9px]">0 - {procs[0].burst}ms</span>
              </div>
              <div style={{ width: `${(procs[1].burst/totalBurst)*100}%` }} className={`border-r border-white flex flex-col items-center justify-center transition-all ${step >= procs[0].burst + procs[1].burst ? 'bg-[#ec4899]' : 'bg-[#ec4899]/40 opacity-70'}`}>
                <span>{procs[1].id}</span>
                <span className="text-[9px]">{procs[0].burst} - {procs[0].burst + procs[1].burst}ms</span>
              </div>
              <div style={{ width: `${(procs[2].burst/totalBurst)*100}%` }} className={`flex flex-col items-center justify-center transition-all ${step >= totalBurst ? 'bg-[#7e22ce]' : 'bg-[#7e22ce]/40 opacity-70'}`}>
                <span>{procs[2].id}</span>
                <span className="text-[9px]">{procs[0].burst + procs[1].burst} - {totalBurst}ms</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 3. Thread Simulator
    function ThreadSim() {
      const [threadCount, setThreadCount] = useState(3);
      const [useLock, setUseLock] = useState(true);
      const [counter, setCounter] = useState(0);
      const [isRunning, setIsRunning] = useState(false);

      const runSim = () => {
        setIsRunning(true);
        let val = 0;
        const target = useLock ? threadCount * 10 : Math.floor(threadCount * 8.5);
        const interval = setInterval(() => {
          val += 1;
          setCounter(val);
          if (val >= target) {
            clearInterval(interval);
            setIsRunning(false);
          }
        }, 70);
      };

      return (
        <div className="bg-white border-2 border-[#701a75] p-5 rounded-2xl space-y-4 text-xs font-mono shadow-sm">
          <div className="flex flex-wrap items-center justify-between gap-3 bg-[#fdf6e2] p-3 rounded-xl border border-[#701a75]/20">
            <div className="flex items-center gap-3">
              <span className="text-[#78350f] font-black">Threads:</span>
              <input type="range" min="1" max="6" value={threadCount} onChange={e => setThreadCount(Number(e.target.value))} className="accent-[#701a75]" />
              <span className="font-black text-[#701a75]">{threadCount} Threads</span>
            </div>
            <label className="flex items-center gap-2 cursor-pointer text-[#78350f] font-black">
              <input type="checkbox" checked={useLock} onChange={e => setUseLock(e.target.checked)} className="accent-[#701a75]" />
              Enable Mutex Lock
            </label>
            <button onClick={runSim} disabled={isRunning} className="px-4 py-2 bg-[#701a75] text-white font-black rounded-xl hover:scale-105 transition disabled:opacity-50">
              {isRunning ? 'Executing...' : '▶ Run Execution'}
            </button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            {Array.from({ length: threadCount }).map((_, i) => (
              <div key={i} className={`p-3 rounded-xl border-2 font-black space-y-1 transition-all ${
                isRunning ? 'bg-[#f3e8ff] border-[#701a75] animate-pulse' : 'bg-white border-[#701a75]/30'
              }`}>
                <div className="text-[#701a75]">Thread #{i + 1}</div>
                <div className="text-[10px] text-[#78350f]">{useLock ? '✓ Mutex Acquired' : '⚠️ Unlocked Shared Access'}</div>
              </div>
            ))}
          </div>

          <div className={`p-4 rounded-xl border-2 text-center text-sm font-black ${useLock ? 'bg-[#059669]/10 border-[#059669] text-[#059669]' : 'bg-[#ef4444]/10 border-[#ef4444] text-[#ef4444]'}`}>
            Shared Counter Value = {counter} {useLock ? '(SYNC EXPLICIT: Target Met)' : '(RACE CONDITION CONFLICT)'}
          </div>
        </div>
      );
    }

    // 4. Process Synchronization Simulator
    function SyncSim() {
      const [cap, setCap] = useState(5);
      const [buffer, setBuffer] = useState(['Item A', 'Item B']);

      const produce = () => {
        if (buffer.length < cap) {
          const char = String.fromCharCode(65 + buffer.length);
          setBuffer([...buffer, `Item ${char}`]);
        }
      };

      const consume = () => {
        if (buffer.length > 0) {
          setBuffer(buffer.slice(0, -1));
        }
      };

      return (
        <div className="bg-white border-2 border-[#701a75] p-5 rounded-2xl space-y-4 text-xs font-mono shadow-sm">
          <div className="flex flex-wrap items-center justify-between gap-3 bg-[#fdf6e2] p-3 rounded-xl border border-[#701a75]/20">
            <div className="flex items-center gap-2">
              <span className="text-[#78350f] font-black">Capacity:</span>

    // 8. Page Replacement Simulator (FIFO, OPTIMAL, LRU WITH DROPDOWN SELECTOR)
    function PageReplaceSim() {
      const [algo, setAlgo] = useState('FIFO');
      const [framesCount, setFramesCount] = useState(3);
      const [pagesStr, setPagesStr] = useState('7, 0, 1, 2, 0, 3, 0, 4, 2, 3');
      const [step, setStep] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [speedMult, setSpeedMult] = useState(1);

      const pageList = pagesStr.split(',').map(s => s.trim()).filter(Boolean);

      useEffect(() => {
        let timer;
        if (isPlaying && step < pageList.length) {
          timer = setTimeout(() => setStep(prev => prev + 1), 700 / speedMult);
        } else if (step >= pageList.length) {
          setIsPlaying(false);
        }
        return () => clearTimeout(timer);
      }, [isPlaying, step, speedMult, pageList.length]);

      // Calculate dynamic page faults & frames up to step
      let frames = [];
      let faultCount = 0;
      let hitCount = 0;
      const stepTrace = [];

      for (let i = 0; i < pageList.length; i++) {
        const p = pageList[i];
        let hit = false;

        if (frames.includes(p)) {
          hit = true;
          hitCount++;
          if (algo === 'LRU') {
            // Re-order for LRU
            frames = [...frames.filter(x => x !== p), p];
          }
        } else {
          faultCount++;
          if (frames.length < framesCount) {
            frames.push(p);
          } else {
            if (algo === 'FIFO') {
              frames.shift();
              frames.push(p);
            } else if (algo === 'LRU') {
              frames.shift();
              frames.push(p);
            } else if (algo === 'OPTIMAL') {
              // OPTIMAL: evict page not used for longest future time
              const rest = pageList.slice(i + 1);
              let victimIdx = -1;
              let furthest = -1;
              for (let f = 0; f < frames.length; f++) {
                const nextIdx = rest.indexOf(frames[f]);
                if (nextIdx === -1) {
                  victimIdx = f;
                  break;
                } else if (nextIdx > furthest) {
                  furthest = nextIdx;
                  victimIdx = f;
                }
              }
              if (victimIdx !== -1) frames.splice(victimIdx, 1);
              else frames.shift();
              frames.push(p);
            }
          }
        }
        stepTrace.push({ page: p, hit, framesSnapshot: [...frames] });
      }

      const activeTrace = stepTrace.slice(0, Math.max(1, step));
      const currentFaults = activeTrace.filter(t => !t.hit).length;
      const currentHits = activeTrace.filter(t => t.hit).length;
      const hitRatio = activeTrace.length > 0 ? ((currentHits / activeTrace.length) * 100).toFixed(1) : 0;

      return (
        <div className="bg-white border-2 border-[#701a75] p-5 rounded-2xl space-y-4 font-mono text-xs shadow-sm">
          {/* Controls Bar */}
          <div className="flex flex-wrap items-center justify-between gap-3 bg-[#fdf6e2] border border-[#701a75]/30 p-3 rounded-xl">
            <div className="flex items-center gap-3">
              <span className="text-[#78350f] font-black">Algorithm:</span>
              <select value={algo} onChange={e => { setAlgo(e.target.value); setStep(0); }} className="bg-white border border-[#701a75] text-[#701a75] p-1.5 rounded-xl font-black">
                <option value="FIFO">FIFO (First-In, First-Out)</option>
                <option value="OPTIMAL">Optimal (OPT / Belady's Min)</option>
                <option value="LRU">LRU (Least Recently Used)</option>
              </select>
            </div>

            <div className="flex items-center gap-3">
              <span className="text-[#78350f] font-black">Frames:</span>
              <input type="number" min="2" max="6" value={framesCount} onChange={e => { setFramesCount(Number(e.target.value)); setStep(0); }} className="w-12 bg-white border border-[#701a75] p-1 rounded font-black text-[#701a75]" />

              <span className="text-[#78350f] font-black">Speed:</span>
              <select value={speedMult} onChange={e => setSpeedMult(Number(e.target.value))} className="bg-white border border-[#701a75] text-[#701a75] p-1 rounded font-black">
                <option value={0.5}>0.5x</option>
                <option value={1}>1.0x</option>
                <option value={2}>2.0x</option>
              </select>
            </div>

            <div className="flex items-center gap-2">
              <button onClick={() => setIsPlaying(!isPlaying)} className="px-3.5 py-1.5 bg-[#701a75] text-white font-black rounded-xl hover:scale-105 transition">
                {isPlaying ? '⏸ Pause' : '▶ Play'}
              </button>
              <button onClick={() => setStep(prev => Math.min(prev + 1, pageList.length))} className="px-3 py-1.5 bg-[#ec4899] text-white font-black rounded-xl hover:scale-105 transition">
                ⏭ Step
              </button>
              <button onClick={() => { setStep(0); setIsPlaying(false); }} className="px-3 py-1.5 bg-[#fdf6e2] border border-[#78350f] text-[#78350f] font-black rounded-xl">
                ↺ Reset
              </button>
            </div>
          </div>

          {/* Custom Student Input Reference String */}
          <div className="flex items-center gap-3 bg-white border border-[#701a75]/20 p-3 rounded-xl">
            <span className="text-[#78350f] font-black">Page Reference String:</span>
            <input type="text" value={pagesStr} onChange={e => { setPagesStr(e.target.value); setStep(0); }} className="flex-1 bg-[#fdf6e2] border border-[#701a75] px-2 py-1 rounded font-black text-[#701a75]" />
          </div>

          {/* Animated Page Grid */}
          <div className="space-y-2">
            <div className="flex justify-between text-[#78350f] font-black">
              <span>Page Replacement Execution Trace ({algo}):</span>
              <span>Step {activeTrace.length} / {pageList.length}</span>
            </div>
            <div className="flex flex-wrap gap-2">
              {activeTrace.map((t, idx) => (
                <div key={idx} className={`p-3 rounded-xl border-2 text-center min-w-[60px] space-y-1 transition-all ${
                  t.hit ? 'bg-[#059669]/10 border-[#059669] text-[#059669]' : 'bg-[#ef4444]/10 border-[#ef4444] text-[#ef4444]'
                }`}>
                  <div className="font-black text-sm">{t.page}</div>
                  <div className={`text-[9px] font-black px-1 py-0.5 rounded text-white ${t.hit ? 'bg-[#059669]' : 'bg-[#ef4444]'}`}>
                    {t.hit ? 'HIT' : 'FAULT'}
                  </div>
                  <div className="text-[8px] text-gray-500 font-mono">[{t.framesSnapshot.join(',')}]</div>
                </div>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-3 gap-3 text-center">
            <div className="bg-[#f3e8ff] border border-[#701a75] p-2.5 rounded-xl text-[#701a75] font-black">Page Faults: {currentFaults}</div>
            <div className="bg-[#f3e8ff] border border-[#701a75] p-2.5 rounded-xl text-[#701a75] font-black">Page Hits: {currentHits}</div>
            <div className="bg-[#059669]/10 border border-[#059669] p-2.5 rounded-xl text-[#059669] font-black">Hit Ratio: {hitRatio}%</div>
          </div>
        </div>
      );
    }

    // 9. Disk Scheduling Simulator (FCFS → SSTF → SCAN → C-SCAN → LOOK → C-LOOK WITH DROPDOWN SELECTOR)
    function DiskSim() {
      const [algo, setAlgo] = useState('SSTF');
      const [head, setHead] = useState(50);
      const [queueStr, setQueueStr] = useState('82, 170, 43, 140, 24, 16, 190');
      const [step, setStep] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [speedMult, setSpeedMult] = useState(1);

      const queue = queueStr.split(',').map(s => Number(s.trim())).filter(n => !isNaN(n));

      // Calculate path according to chosen algorithm
      let path = [head];
      if (algo === 'FCFS') {
        path = [head, ...queue];
      } else if (algo === 'SSTF') {
        let curr = head;
        let unvisited = [...queue];
        while (unvisited.length > 0) {
          unvisited.sort((a, b) => Math.abs(a - curr) - Math.abs(b - curr));
          curr = unvisited.shift();
          path.push(curr);
        }
      } else if (algo === 'SCAN') {
        const left = queue.filter(q => q < head).sort((a, b) => b - a);
        const right = queue.filter(q => q >= head).sort((a, b) => a - b);
        path = [head, ...right, 199, ...left];
      } else if (algo === 'C-SCAN') {
        const left = queue.filter(q => q < head).sort((a, b) => a - b);
        const right = queue.filter(q => q >= head).sort((a, b) => a - b);
        path = [head, ...right, 199, 0, ...left];
      } else if (algo === 'LOOK') {
        const left = queue.filter(q => q < head).sort((a, b) => b - a);
        const right = queue.filter(q => q >= head).sort((a, b) => a - b);
        path = [head, ...right, ...left];
      } else if (algo === 'C-LOOK') {
        const left = queue.filter(q => q < head).sort((a, b) => a - b);
        const right = queue.filter(q => q >= head).sort((a, b) => a - b);
        path = [head, ...right, ...left];
      }

      useEffect(() => {
        let timer;
        if (isPlaying && step < path.length - 1) {
          timer = setTimeout(() => setStep(prev => prev + 1), 600 / speedMult);
        } else if (step >= path.length - 1) {
          setIsPlaying(false);
        }
        return () => clearTimeout(timer);
      }, [isPlaying, step, speedMult, path.length]);

      // Calculate total seek distance up to current step
      let totalSeek = 0;
      for (let i = 0; i < step; i++) {
        totalSeek += Math.abs(path[i + 1] - path[i]);
      }

      const activeHead = path[Math.min(step, path.length - 1)];

      return (
        <div className="bg-white border-2 border-[#701a75] p-5 rounded-2xl space-y-4 font-mono text-xs shadow-sm">
          {/* Controls Header */}
          <div className="flex flex-wrap items-center justify-between gap-3 bg-[#fdf6e2] border border-[#701a75]/30 p-3 rounded-xl">
            <div className="flex items-center gap-3">
              <span className="text-[#78350f] font-black">Disk Algorithm:</span>
              <select value={algo} onChange={e => { setAlgo(e.target.value); setStep(0); }} className="bg-white border border-[#701a75] text-[#701a75] p-1.5 rounded-xl font-black">
                <option value="FCFS">FCFS (First-Come First-Served)</option>
                <option value="SSTF">SSTF (Shortest Seek Time First)</option>
                <option value="SCAN">SCAN (Elevator)</option>
                <option value="C-SCAN">C-SCAN (Circular SCAN)</option>
                <option value="LOOK">LOOK</option>
                <option value="C-LOOK">C-LOOK (Circular LOOK)</option>
              </select>
            </div>

            <div className="flex items-center gap-3">
              <span className="text-[#78350f] font-black">Speed:</span>
              <select value={speedMult} onChange={e => setSpeedMult(Number(e.target.value))} className="bg-white border border-[#701a75] text-[#701a75] p-1 rounded font-black">
                <option value={0.5}>0.5x</option>
                <option value={1}>1.0x</option>
                <option value={2}>2.0x</option>
              </select>

              <button onClick={() => setIsPlaying(!isPlaying)} className="px-3.5 py-1.5 bg-[#701a75] text-white font-black rounded-xl hover:scale-105 transition">
                {isPlaying ? '⏸ Pause' : '▶ Play'}
              </button>
              <button onClick={() => setStep(prev => Math.min(prev + 1, path.length - 1))} className="px-3 py-1.5 bg-[#ec4899] text-white font-black rounded-xl hover:scale-105 transition">
                ⏭ Step
              </button>
              <button onClick={() => { setStep(0); setIsPlaying(false); }} className="px-3 py-1.5 bg-[#fdf6e2] border border-[#78350f] text-[#78350f] font-black rounded-xl">
                ↺ Reset
              </button>
            </div>
          </div>

          {/* Custom Student Input Fields */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-white border border-[#701a75]/20 p-3 rounded-xl">
            <div className="space-y-1">
              <label className="text-[#701a75] font-black">Initial Head Cylinder ({head}):</label>
              <input type="range" min="0" max="199" value={head} onChange={e => { setHead(Number(e.target.value)); setStep(0); }} className="w-full accent-[#701a75]" />
            </div>
            <div className="space-y-1">
              <label className="text-[#701a75] font-black">Request Queue (Cylinders 0-199):</label>
              <input type="text" value={queueStr} onChange={e => { setQueueStr(e.target.value); setStep(0); }} className="w-full bg-[#fdf6e2] border border-[#701a75] p-1 rounded font-black text-[#701a75]" />
            </div>
          </div>

          {/* Animated Cylinder Track Bar */}
          <div className="space-y-2">
            <div className="flex justify-between text-[#78350f] font-black">
              <span>Disk Head Arm Position (Cylinder {activeHead}):</span>
              <span>Step {step} / {path.length - 1}</span>
            </div>
            <div className="relative w-full bg-[#fdf6e2] border-2 border-[#701a75] h-12 rounded-xl flex items-center px-2 overflow-hidden shadow-inner">
              <div style={{ left: `${(activeHead/199)*92}%` }} className="absolute w-6 h-8 bg-[#ec4899] border-2 border-white rounded-md flex items-center justify-center text-white text-[9px] font-black transition-all shadow-md">
                H
              </div>
            </div>
          </div>

          <div className="text-[#059669] font-black text-sm text-center bg-[#059669]/10 p-3 rounded-xl border border-[#059669]">
            {algo} Calculated Path: {path.slice(0, step + 1).join(' ➔ ')} | Total Seek Distance = {totalSeek} Cylinders
          </div>
        </div>
      );
    }

    // 10. File Systems Simulator (Contiguous, Linked, and Indexed Allocation)
    function FileSystemSim() {
      const [method, setMethod] = useState('indexed');
      const [fname, setFname] = useState('report.pdf');
      const [numBlocks, setNumBlocks] = useState(4);

      return (
        <div className="bg-white border-2 border-[#701a75] p-5 rounded-2xl space-y-4 text-xs font-mono shadow-sm">
          {/* Method Selector */}
          <div className="flex flex-wrap items-center justify-between gap-3 bg-[#fdf6e2] p-3 rounded-xl border border-[#701a75]/20">
            <div className="flex items-center gap-3">
              <span className="text-[#78350f] font-black">File Allocation Method:</span>
              <select value={method} onChange={e => setMethod(e.target.value)} className="bg-white border border-[#701a75] text-[#701a75] p-1.5 rounded-xl font-black">
                <option value="contiguous">Contiguous Allocation (Continuous Sectors)</option>
                <option value="linked">Linked Allocation (Pointer Chains)</option>
                <option value="indexed">Indexed Allocation (Index Block / Inode)</option>
              </select>
            </div>
          </div>

          {/* Main Idea Explanation Card */}
          <div className="bg-[#f3e8ff] border border-[#701a75] p-3.5 rounded-xl text-[#701a75] space-y-1">
            <div className="font-black text-sm">
              {method === 'contiguous' && '📁 Contiguous Allocation'}
              {method === 'linked' && '🔗 Linked Allocation'}
              {method === 'indexed' && '🗂 Indexed Allocation (Inode)'}
            </div>
            <div className="text-xs text-[#78350f] font-bold">
              {method === 'contiguous' && 'Main Idea: File blocks are stored continuously on sequential disk sectors. Simple and fast, but prone to external fragmentation.'}
              {method === 'linked' && 'Main Idea: Each disk block contains file data AND a pointer to the next block. Eliminates external fragmentation, but requires sequential traversal.'}
              {method === 'indexed' && 'Main Idea: An Index Block / Inode stores pointers to all file blocks together in an array. Supports fast direct access without external fragmentation!'}
            </div>
          </div>

          {/* Student Inputs */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-white border border-[#701a75]/20 p-3 rounded-xl">
            <div className="space-y-1">
              <label className="text-[#701a75] font-black">File Name:</label>
              <input type="text" value={fname} onChange={e => setFname(e.target.value)} className="w-full bg-[#fdf6e2] border border-[#701a75] p-1 rounded font-black text-[#701a75]" />
            </div>
            <div className="space-y-1">
              <label className="text-[#701a75] font-black">File Size ({numBlocks} Blocks):</label>
              <input type="range" min="1" max="6" value={numBlocks} onChange={e => setNumBlocks(Number(e.target.value))} className="w-full accent-[#701a75]" />
            </div>
          </div>

          {/* Sector Visualization Grid */}
          <div className="space-y-2">
            <div className="text-[#78350f] font-black">Disk Sector Blocks (16 Sectors Total):</div>
            <div className="grid grid-cols-8 gap-2 text-center">
              {Array.from({ length: 16 }).map((_, i) => {
                let label = `Sec #${i}`;
                let style = 'bg-[#fdf6e2] text-[#78350f] border-[#78350f]/20';

                if (method === 'contiguous') {
                  const contiguousSectors = Array.from({ length: numBlocks }, (_, b) => 4 + b);
                  if (contiguousSectors.includes(i)) {
                    label = `BLK #${i - 4}`;
                    style = 'bg-[#701a75] text-white border-purple-900 shadow-sm';
                  }
                } else if (method === 'linked') {
                  const linkedSectors = [2, 7, 12, 15, 3, 9].slice(0, numBlocks);
                  if (linkedSectors.includes(i)) {
                    const chainIdx = linkedSectors.indexOf(i);
                    const nextSec = linkedSectors[chainIdx + 1];
                    label = nextSec !== undefined ? `SEC ${i} ➔ ${nextSec}` : `SEC ${i} ➔ END`;
                    style = 'bg-[#ec4899] text-white border-pink-900 shadow-sm';
                  }
                } else if (method === 'indexed') {
                  const indexedData = [4, 7, 12, 15, 2, 9].slice(0, numBlocks);
                  if (i === 5) {
                    label = 'INDEX #5';
                    style = 'bg-[#f59e0b] text-white border-amber-600 shadow-sm';
                  } else if (indexedData.includes(i)) {
                    label = `PTR #${indexedData.indexOf(i)}`;
                    style = 'bg-[#701a75] text-white border-purple-900 shadow-sm';
                  }
                }

                return (
                  <div key={i} className={`p-2 rounded-xl border-2 font-black text-[10px] ${style}`}>
                    {label}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // STEP 3: TASK STEP (CUSTOM STUDENT INPUTS & VALIDATION)
    // -------------------------------------------------------------
    function TaskStep({ moduleData, onDone }) {
      const { task } = moduleData;
      const [selected, setSelected] = useState(null);
      const [submitted, setSubmitted] = useState(false);
      const [customBurst, setCustomBurst] = useState("24, 3, 3");

      const handleSubmit = () => {
        if (selected === null) return;
        setSubmitted(true);
        if (selected === task.correctAnswer) {
          setTimeout(() => onDone(), 600);
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white border-2 border-[#701a75] p-6 rounded-2xl space-y-4 shadow-sm">
            <h3 className="font-black text-[#701a75] text-base">{task.title}</h3>
            <p className="text-[#78350f] text-xs font-extrabold">{task.instructions}</p>

            {moduleData.id === 'cpu-scheduling' && (
              <div className="bg-[#fdf6e2] p-4 rounded-xl border border-[#78350f]/20 space-y-2">
                <label className="text-xs font-mono font-black text-[#701a75]">Custom Process Burst Times (comma-separated):</label>
                <input
                  type="text"
                  value={customBurst}
                  onChange={(e) => setCustomBurst(e.target.value)}
                  className="w-full bg-white border border-[#701a75] rounded-xl p-2 text-xs font-mono font-black text-[#701a75]"
                />
              </div>
            )}

            <div className="bg-[#fdf6e2] p-4 rounded-xl border border-[#701a75]/30 text-[#3b0764] text-sm font-black">
              {task.question}
            </div>
          </div>

          <div className="space-y-3">
            {task.options.map((opt, idx) => {
              let style = "bg-white border-[#78350f]/20 text-[#3b0764]";
              if (selected === idx) style = "bg-[#f3e8ff] border-[#701a75] text-[#701a75] font-black";
              if (submitted) {
                if (idx === task.correctAnswer) style = "bg-[#059669]/10 border-[#059669] text-[#059669] font-black";
                else if (selected === idx) style = "bg-[#ef4444]/10 border-[#ef4444] text-[#ef4444]";
              }

              return (
                <button
                  key={idx}
                  disabled={submitted}
                  onClick={() => setSelected(idx)}
                  className={`w-full p-4 rounded-2xl border-2 text-left text-xs font-extrabold transition ${style}`}
                >
                  {opt}
                </button>
              );
            })}
          </div>

          {!submitted ? (
            <button onClick={handleSubmit} disabled={selected === null} className="w-full py-4 bg-gradient-to-r from-[#701a75] to-[#7e22ce] text-white font-black text-sm rounded-xl shadow-md disabled:opacity-40 hover:scale-[1.01] transition">
              Submit Task Solution
            </button>
          ) : (
            <div className={`p-4 rounded-xl border-2 text-xs font-mono font-black ${selected === task.correctAnswer ? 'bg-[#059669]/10 border-[#059669] text-[#059669]' : 'bg-[#ef4444]/10 border-[#ef4444] text-[#ef4444]'}`}>
              {task.explanation}
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------
    // STEP 4: TERMINAL CLI SHELL STEP
    // -------------------------------------------------------------
    function TerminalStep({ moduleId, onDone }) {
      const [input, setInput] = useState('');
      const [history, setHistory] = useState([
        { type: 'sys', text: 'Simulated OS CLI Shell v6.0' },
        { type: 'sys', text: 'Type "help" to view supported commands.' }
      ]);

      const handleCmd = (cmdStr) => {
        const cmd = cmdStr.trim().toLowerCase();
        if (!cmd) return;

        let out = [];
        if (cmd === 'help') out = ['Available commands: help, cpu schedule, memory, disk, deadlock, paging, sync, clear'];
        else if (cmd === 'cpu schedule') out = ['[CPU Scheduler] Gantt Chart generated. Avg WT = 7.33 ms'];
        else if (cmd === 'memory') out = ['[Memory] Allocated P1 (212KB) into Block 1 (500KB) via Best-Fit.'];
        else if (cmd === 'disk') out = ['[Disk] SSTF Head Path: 50 -> 43 -> 82 -> 170. Total Seek: 134 Cylinders.'];
        else if (cmd === 'deadlock') out = ['[Banker] Safe Sequence found: P1 -> P3 -> P2. No Deadlock.'];
        else if (cmd === 'clear') { setHistory([]); setInput(''); return; }
        else out = [`os-shell: command not found: ${cmd}. Type "help".`];

        setHistory(prev => [...prev, { type: 'user', text: `$ ${cmd}` }, ...out.map(t => ({ type: 'out', text: t }))]);
        setInput('');
      };

      return (
        <div className="bg-[#3b0764] border-3 border-[#701a75] rounded-2xl overflow-hidden font-mono text-xs shadow-pop">
          <div className="bg-[#701a75] px-4 py-3 text-white font-black flex justify-between">
            <span>simulated-os-shell ~ zsh</span>
            <button onClick={() => setHistory([])} className="hover:underline">Clear</button>
          </div>

          <div className="p-4 h-64 overflow-y-auto space-y-1.5 text-white">
            {history.map((h, i) => (
              <div key={i} className={h.type === 'user' ? 'text-[#f59e0b] font-black' : h.type === 'sys' ? 'text-purple-200' : 'text-[#34d399]'}>
                {h.text}
              </div>
            ))}
          </div>

          <form onSubmit={(e) => { e.preventDefault(); handleCmd(input); }} className="bg-[#2e1065] p-3 border-t border-[#701a75] flex gap-2">
            <span className="text-[#f59e0b] font-black">$</span>
            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              placeholder="Try 'help', 'cpu schedule', 'memory', 'disk'..."
              className="w-full bg-transparent outline-none text-white font-black placeholder-purple-300/50"
            />
          </form>

          <div className="p-3 bg-white">
            <button onClick={onDone} className="w-full py-3 bg-gradient-to-r from-[#701a75] to-[#7e22ce] text-white font-black text-xs rounded-xl shadow-md hover:scale-[1.01] transition">
              ✓ Complete CLI Shell & Next Task ➔
            </button>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // STEP 5: QUIZ STEP (EXACTLY 5 QUIZZES PER MODULE)
    // -------------------------------------------------------------
    function QuizStep({ moduleData, setQuizScore, onDone }) {
      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const questions = moduleData.quiz;

      const submitQuiz = () => {
        let correct = 0;
        questions.forEach(q => {
          if (answers[q.id] === q.correctIndex) correct++;
        });
        const score = Math.round((correct / questions.length) * 100);
        setSubmitted(true);
        setQuizScore(moduleData.id, score);
        setTimeout(() => onDone(), 800);
      };

      return (
        <div className="space-y-6">
          <div className="bg-white border-2 border-[#701a75] p-4 rounded-xl text-xs font-mono font-black text-[#701a75] flex justify-between">
            <span>❓ Module Quiz (5 Questions)</span>
            <span>Answer all 5 to complete</span>
          </div>

          {questions.map((q, idx) => (
            <div key={q.id} className="bg-white border-2 border-[#701a75] p-5 rounded-2xl space-y-3 shadow-sm">
              <h4 className="font-black text-[#3b0764] text-sm">{idx + 1}. {q.question}</h4>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                {q.options.map((opt, oIdx) => {
                  let style = "bg-[#fdf6e2] border-[#78350f]/20 text-[#3b0764]";
                  if (answers[q.id] === oIdx) style = "bg-[#f3e8ff] border-[#701a75] text-[#701a75] font-black";
                  if (submitted) {
                    if (oIdx === q.correctIndex) style = "bg-[#059669]/10 border-[#059669] text-[#059669] font-black";
                    else if (answers[q.id] === oIdx) style = "bg-[#ef4444]/10 border-[#ef4444] text-[#ef4444]";
                  }
                  return (
                    <button
                      key={oIdx}
                      disabled={submitted}
                      onClick={() => setAnswers({ ...answers, [q.id]: oIdx })}
                      className={`p-3.5 rounded-xl border-2 text-left text-xs font-extrabold transition ${style}`}
                    >
                      {opt}
                    </button>
                  );
                })}
              </div>
              {submitted && <div className="text-xs text-[#78350f] bg-[#fdf6e2] p-3 rounded-xl font-bold leading-relaxed">{q.explanation}</div>}
            </div>
          ))}

          {!submitted ? (
            <button onClick={submitQuiz} disabled={Object.keys(answers).length < questions.length} className="w-full py-4 bg-gradient-to-r from-[#701a75] to-[#7e22ce] text-white font-black text-sm rounded-xl shadow-md disabled:opacity-40 hover:scale-[1.01] transition">
              Submit Quiz Answers ({Object.keys(answers).length} / 5 Answered)
            </button>
          ) : (
            <div className="bg-white border-2 border-[#059669] p-6 rounded-2xl text-center space-y-2 shadow-sm">
              <div className="text-xl font-black text-[#059669]">Quiz Submitted & Score Recorded!</div>
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------
    // STEP 6: DEDICATED COMPLETED STEP
    // -------------------------------------------------------------
    function CompletedStep({ moduleData, onDashboard }) {
      return (
        <div className="bg-white border-4 border-[#701a75] p-8 sm:p-12 rounded-3xl text-center space-y-6 shadow-pop">
          <div className="text-6xl animate-bounce">🎓</div>
          <div>
            <div className="text-xs font-mono font-black text-[#701a75] uppercase tracking-widest">MODULE COMPLETED</div>
            <h2 className="text-3xl font-black text-[#3b0764] mt-1">Module {moduleData.num}: {moduleData.title}</h2>
            <p className="text-sm text-[#78350f] font-extrabold mt-2 max-w-md mx-auto">
              All 5 steps — Learn, Animation, Task, Terminal, and Quiz — are fully finished for this module!
            </p>
          </div>

          <div className="flex flex-wrap justify-center gap-2">
            {['📖 Learn', '🎬 Animation', '🛠 Task', '💻 Terminal', '❓ Quiz'].map((label, idx) => (
              <span key={idx} className="bg-[#f3e8ff] border border-[#701a75] text-[#701a75] font-black px-3 py-1 rounded-full text-xs">
                ✓ {label}
              </span>
            ))}
          </div>

          <button onClick={onDashboard} className="px-8 py-4 bg-gradient-to-r from-[#701a75] to-[#7e22ce] text-white font-black text-sm rounded-2xl shadow-lg hover:scale-105 transition">
            🏠 Return to Main Dashboard
          </button>
        </div>
      );
    }

    // Render App into DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
