  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <!-- Main Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef, createContext, useContext } = React;

    // -------------------------------------------------------------
    // DATA DEFINITIONS (10 TOPICS, TASKS, QUIZZES, ACHIEVEMENTS)
    // -------------------------------------------------------------
    const MODULES_DATA = [
      {

            { term: "Process States", definition: "Life cycle stages: New, Ready, Running, Waiting (Blocked), and Terminated." },
            { term: "Forking", definition: "Unix system call to duplicate calling parent process into a child process." }

          {

          {
            id: "pm_2",

              "CPU speed doubles",

              "Process RAM is erased",

        ]
      },
      {
        id: "cpu-scheduling",
        title: "CPU Scheduling",
        category: "Scheduling",
        shortDesc: "Simulate and compare FCFS, Shortest Job First (SJF), Priority Scheduling, and Round Robin (RR) with Gantt charts.",

        learn: {
          overview: "CPU scheduling allocates CPU cores to ready processes to maximize CPU utilization and throughput while minimizing waiting and turnaround time.",

            { term: "Burst Time", definition: "Amount of CPU time required by a process for execution." },
            { term: "Turnaround Time (TAT)", definition: "Completion Time - Arrival Time." },
            { term: "Waiting Time (WT)", definition: "Total time spent waiting in ready queue (TAT - Burst Time)." },
            { term: "Time Quantum", definition: "Fixed CPU execution time slice in Round Robin scheduling." }
          ],
          realWorldAnalogy: "Like a single bank teller serving a line of customers. FCFS serves by arrival. SJF serves quick requests first. Round Robin spends 2 minutes per customer before rotating."
        },
        task: {
          title: "Calculate Average Waiting Time (FCFS)",
          instructions: "Calculate Average Waiting Time for 3 processes arriving at time 0 with Burst Times: P1=24ms, P2=3ms, P3=3ms.",
          question: "What is the Average Waiting Time under FCFS?",
          options: ["17.0 ms", "9.0 ms", "8.0 ms", "12.0 ms"],
          correctAnswer: 0,
          explanation: "Waiting times: P1=0ms, P2=24ms, P3=27ms. Sum = 51ms. Average = 51 / 3 = 17.0 ms."
        },
        quiz: [
          {
            id: "cs_1",
            question: "Which algorithm gives minimum average waiting time for a given set of processes?",
            options: ["FCFS", "Shortest Job First (SJF)", "Round Robin", "Priority Scheduling"],
            correctIndex: 1,
            explanation: "SJF is provably optimal for minimizing average waiting time."
          }
        ]
      },
      {
        id: "threads",
        title: "Threads & Concurrency",
        category: "Concurrency",
        shortDesc: "Explore lightweight execution units, User vs. Kernel threads, multithreading models, and race conditions.",
        icon: "git-fork",
        color: "from-cyan-500 to-blue-600",
        learn: {
          overview: "A thread is a basic unit of CPU utilization comprising thread ID, program counter, registers, and stack, while sharing data/code sections with sibling threads.",
          keyTerms: [
            { term: "User Threads", definition: "Threads managed in user space without kernel awareness." },
            { term: "Kernel Threads", definition: "Threads managed directly by the operating system kernel." },
            { term: "Race Condition", definition: "Concurrent shared data modification flaw where final result depends on timing." }
          ],
          realWorldAnalogy: "A process is a factory building. Threads are multiple workers inside who share tools and raw materials (shared memory)."
        },
        task: {
          title: "Race Condition Analyzer",
          instructions: "Two threads execute x = x + 1 concurrently on initial value x = 5 without locks.",
          question: "What are possible final values of x if non-atomic steps interleave?",
          options: ["Only 7", "6 or 7", "5 or 6", "6 only"],
          correctAnswer: 1,
          explanation: "If both read x=5 simultaneously before either writes back, both write 6. If executed sequentially, result is 7. Thus 6 or 7."
        },
        quiz: [
          {
            id: "th_1",
            question: "Which component is SHARED among threads of the same process?",
            options: ["Registers", "Stack", "Program Counter", "Data Section and Heap"],
            correctIndex: 3,
            explanation: "Threads share global variables, static data, and heap space, but keep their own stack and registers."
          }
        ]
      },
      {
        id: "process-sync",
        title: "Process Synchronization",
        category: "Concurrency",
        shortDesc: "Master Critical Section Problem, Mutex Locks, Semaphores, Producer-Consumer, and Dining Philosophers.",
        icon: "lock",
        color: "from-emerald-500 to-teal-600",
        learn: {
          overview: "Process synchronization ensures orderly execution of cooperating processes to maintain data consistency in critical sections.",
          keyTerms: [
            { term: "Critical Section", definition: "Code segment accessing shared variables or resources." },
            { term: "Mutex Lock", definition: "Binary lock object used to enforce mutual exclusion." },
            { term: "Semaphore", definition: "Atomic integer variable accessed via wait() and signal() operations." }
          ],
          realWorldAnalogy: "A single restroom with a key card (Mutex). Only person holding key card can enter. Others line up outside."
        },
        task: {
          title: "Semaphore Value Calculator",
          instructions: "Semaphore S = 5. Sequence executed: 8 wait(S) operations followed by 5 signal(S) operations.",
          question: "What is final value of Semaphore S?",
          options: ["2", "5", "0", "-3"],
          correctAnswer: 0,
          explanation: "Initial S=5. 8 wait operations: 5 - 8 = -3. 5 signal operations: -3 + 5 = 2."
        },
        quiz: [
          {
            id: "ps_1",
            question: "Which requirement ensures no process waits indefinitely to enter critical section?",
            options: ["Mutual Exclusion", "Bounded Waiting", "Progress", "Preemption"],
            correctIndex: 1,
            explanation: "Bounded Waiting guarantees a limit on waiting requests."
          }
        ]
      },
      {
        id: "deadlocks",
        title: "Deadlocks",
        category: "Concurrency",
        shortDesc: "Analyze 4 Coffman conditions, Resource Allocation Graphs (RAG), Banker's Algorithm for Safe State, and Recovery.",
        icon: "alert-triangle",
        color: "from-amber-500 to-orange-600",
        learn: {
          overview: "A deadlock is a state where a set of processes are blocked because each holds a resource and waits for another resource held by another process.",
          keyTerms: [
            { term: "Coffman Conditions", definition: "Mutual Exclusion, Hold & Wait, No Preemption, Circular Wait." },
            { term: "Banker's Algorithm", definition: "Deadlock avoidance algorithm that tests safe state execution sequence." },
            { term: "Safe State", definition: "State where a safe process sequence exists to complete execution without deadlock." }
          ],
          realWorldAnalogy: "4 cars arriving simultaneously at a 4-way stop intersection blocking each other in a circle."
        },
        task: {
          title: "Banker's Need Matrix Calculation",
          instructions: "Allocation = [2, 1, 1], Max = [4, 3, 3] for process P0.",
          question: "Calculate Need row for process P0.",
          options: ["[2, 2, 2]", "[6, 4, 4]", "[2, 1, 1]", "[1, 2, 2]"],
          correctAnswer: 0,
          explanation: "Need = Max - Allocation = [4-2, 3-1, 3-1] = [2, 2, 2]."
        },
        quiz: [
          {
            id: "dl_1",
            question: "Which condition is NOT one of 4 necessary Coffman conditions?",
            options: ["Mutual Exclusion", "Circular Wait", "Preemption Allowed", "Hold and Wait"],
            correctIndex: 2,
            explanation: "No Preemption is a Coffman condition. Preemption Allowed prevents deadlock."
          }
        ]
      },
      {
        id: "memory-management",
        title: "Memory Management",
        category: "Memory",
        shortDesc: "Master contiguous memory allocation strategies: First-Fit, Best-Fit, Worst-Fit, internal and external fragmentation.",
        icon: "database",
        color: "from-rose-500 to-red-600",
        learn: {
          overview: "Memory management allocates main RAM memory partitions to processes and reclaims memory upon process termination.",
          keyTerms: [
            { term: "External Fragmentation", definition: "Total free space is sufficient, but split into non-contiguous small holes." },
            { term: "First-Fit", definition: "Allocates first hole large enough for incoming process." },
            { term: "Best-Fit", definition: "Allocates smallest hole that is large enough, minimizing leftover hole." },
            { term: "Worst-Fit", definition: "Allocates largest available hole, leaving largest leftover space." }
          ],
          realWorldAnalogy: "Parking cars in a lot. First-fit takes first open slot. Best-fit finds tightest fitting slot. Worst-fit picks largest RV slot."
        },
        task: {
          title: "Memory Allocation Strategy Test",
          instructions: "Holes: 100KB, 500KB, 200KB, 300KB, 600KB. Process requests 212KB.",
          question: "Which hole will Best-Fit choose?",
          options: ["500KB hole", "300KB hole", "600KB hole", "200KB hole"],
          correctAnswer: 1,
          explanation: "Best-fit chooses smallest hole >= 212KB. 300KB is the smallest suitable hole."
        },
        quiz: [
          {
            id: "mm_1",
            question: "Which strategy leaves largest leftover hole after allocation?",
            options: ["First-Fit", "Best-Fit", "Worst-Fit", "Next-Fit"],
            correctIndex: 2,
            explanation: "Worst-Fit specifically picks largest hole."
          }
        ]
      },
      {
        id: "paging",
        title: "Paging & Address Translation",
        category: "Memory",
        shortDesc: "Understand non-contiguous memory, page tables, logical to physical address translation, and TLB speedup.",
        icon: "layers",
        color: "from-indigo-500 to-purple-600",
        learn: {
          overview: "Paging divides logical memory into fixed-size Pages and physical RAM into same-sized Frames. The CPU MMU maps page number p to frame f using Page Table.",
          keyTerms: [
            { term: "Page & Frame", definition: "Page is logical block; Frame is physical RAM block of identical size." },
            { term: "TLB", definition: "Translation Lookaside Buffer high-speed associative hardware cache for address translation." }
          ],
          realWorldAnalogy: "Book Table of Contents mapping logical chapter numbers to physical printed page numbers."
        },
        task: {
          title: "Address Translation Task",
          instructions: "Page Size = 1024 bytes (1KB). Logical Address has Page p=2, Offset d=400. Page 2 maps to Frame 5.",
          question: "What is physical address?",
          options: ["5520", "2448", "5120", "4496"],
          correctAnswer: 0,
          explanation: "Physical Address = (Frame * Page Size) + Offset = (5 * 1024) + 400 = 5520."
        },
        quiz: [
          {
            id: "pg_1",
            question: "Hardware component that accelerates address translation:",
            options: ["DMA", "TLB (Translation Lookaside Buffer)", "ALU", "Cache Controller"],
            correctIndex: 1,
            explanation: "TLB caches recent page-to-frame translations."
          }
        ]
      },
      {
        id: "page-replacement",
        title: "Page Replacement Algorithms",
        category: "Memory",
        shortDesc: "Simulate virtual memory page fault handling with FIFO, LRU, and Optimal replacement algorithms.",
        icon: "refresh-cw",
        color: "from-teal-500 to-emerald-600",
        learn: {
          overview: "Virtual memory loads pages on demand. When a requested page is not in RAM, a Page Fault occurs, requiring a page replacement algorithm to select a victim frame.",
          keyTerms: [
            { term: "Page Fault", definition: "Interrupt raised when accessing a page not present in RAM." },
            { term: "FIFO", definition: "Replaces oldest page loaded first." },
            { term: "LRU", definition: "Replaces page not used for longest time period." },
            { term: "Belady's Anomaly", definition: "Increasing frames increases page faults (occurs in FIFO)." }
          ],
          realWorldAnalogy: "A workbench with 3 tools. When you need a wrench not on workbench, you put back tool untouched longest (LRU)."
        },
        task: {
          title: "FIFO Page Fault Tracing",
          instructions: "Ref string: 7, 0, 1, 2 with 3 empty page frames initially under FIFO.",
          question: "How many total page faults occur?",
          options: ["4", "3", "5", "2"],
          correctAnswer: 0,
          explanation: "7 (Fault [7]), 0 (Fault [7,0]), 1 (Fault [7,0,1]), 2 (Fault replaces 7 -> [2,0,1]). Total 4 faults."
        },
        quiz: [
          {
            id: "pr_1",
            question: "Which algorithm suffers from Belady's Anomaly?",
            options: ["Optimal", "LRU", "FIFO", "MRU"],
            correctIndex: 2,
            explanation: "FIFO can exhibit Belady's Anomaly."
          }
        ]
      },
      {
        id: "disk-scheduling",
        title: "Disk Scheduling",
        category: "Storage",
        shortDesc: "Visualize disk head movements across cylinders for FCFS, SSTF, SCAN (Elevator), C-SCAN, and LOOK.",
        icon: "hard-drive",
        color: "from-sky-500 to-blue-600",
        learn: {
          overview: "Disk scheduling manages magnetic disk head arm seek movements to minimize total seek distance and maximize I/O throughput.",
          keyTerms: [
            { term: "Seek Time", definition: "Time for disk head arm to move to target cylinder track." },
            { term: "SSTF", definition: "Services request closest to current head position." },
            { term: "SCAN (Elevator)", definition: "Moves head from one end to another servicing requests along path." }
          ],
          realWorldAnalogy: "Skyscraper elevator moving continuously floor to floor servicing requested stops."
        },
        task: {
          title: "Total Head Movement (FCFS)",
          instructions: "Head at 50. Queue: [82, 170, 43].",
          question: "Calculate total cylinder head movement under FCFS.",
          options: ["247 cylinders", "277 cylinders", "150 cylinders", "300 cylinders"],
          correctAnswer: 0,
          explanation: "|82-50| = 32. |170-82| = 88. |43-170| = 127. Total = 32 + 88 + 127 = 247."
        },
        quiz: [
          {

            options: ["FCFS", "SSTF", "SCAN", "LOOK"],
            correctIndex: 1,

      },
      {
        id: "file-systems",

        category: "Storage",
        shortDesc: "Inspect directory trees, file control blocks, Contiguous, Linked, and Indexed file allocation (Inodes).",
        icon: "folder-tree",
        color: "from-violet-500 to-purple-600",
        learn: {
          overview: "File systems map logical files to physical disk blocks using Contiguous, Linked, or Indexed (Inode) file block allocation strategies.",
          keyTerms: [
            { term: "Inode (FCB)", definition: "Data structure storing file metadata and direct/indirect disk block pointers." },
            { term: "Indexed Allocation", definition: "Brings all file block pointers into an Index Block for direct block access." }
          ],
          realWorldAnalogy: "Indexed allocation is like a book index pointing directly to specific page numbers."
        },
        task: {
          title: "Indexed Block Lookup",
          instructions: "Index Block at sector 5 contains pointers: [4, 7, 12, 15].",
          question: "Which disk sector contains logical block index 2?",
          options: ["Sector 12", "Sector 7", "Sector 4", "Sector 15"],
          correctAnswer: 0,
          explanation: "Logical index 0->4, 1->7, 2->12, 3->15. Logical index 2 maps to Sector 12."
        },
        quiz: [
          {
            id: "fs_1",
            question: "Method that allows direct access WITHOUT external fragmentation:",
            options: ["Contiguous", "Linked", "Indexed Allocation", "FAT"],
            correctIndex: 2,
            explanation: "Indexed allocation supports direct access via index block without external fragmentation."
          }
        ]
      }
    ];

    const ACHIEVEMENTS = [
      { id: "first_module", title: "First Step", desc: "Complete your first OS module" },
      { id: "halfway", title: "OS Scholar", desc: "Complete 5 OS Virtual Lab modules" },
      { id: "master", title: "OS Master", desc: "Complete all 10 OS Virtual Lab modules" },
      { id: "quiz_ace", title: "Quiz Wizard", desc: "Score 100% on any module quiz" }
    ];

    // -------------------------------------------------------------
    // MAIN APP COMPONENT
    // -------------------------------------------------------------
    function App() {
      const [currentModuleId, setCurrentModuleId] = useState(null); // null = Dashboard
      const [currentStep, setCurrentStep] = useState(1);
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [achievementsOpen, setAchievementsOpen] = useState(false);
      const [toast, setToast] = useState(null);

      // LocalStorage Progress State
      const [progress, setProgress] = useState(() => {
        const saved = localStorage.getItem('os_lab_prog_v3');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        const init = {};
        MODULES_DATA.forEach(m => {
          init[m.id] = { learn: false, animation: false, task: false, terminal: false, quiz: false, completed: false, quizScore: 0 };
        });
        return init;
      });

      const [unlockedAchievements, setUnlockedAchievements] = useState(() => {
        const saved = localStorage.getItem('os_lab_ach_v3');
        return saved ? JSON.parse(saved) : [];
      });

      useEffect(() => {
        localStorage.setItem('os_lab_prog_v3', JSON.stringify(progress));
      }, [progress]);

      useEffect(() => {
        localStorage.setItem('os_lab_ach_v3', JSON.stringify(unlockedAchievements));
      }, [unlockedAchievements]);

      useEffect(() => {
        lucide.createIcons();
      });

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const unlockAchievement = (id) => {
        if (!unlockedAchievements.includes(id)) {
          setUnlockedAchievements(prev => [...prev, id]);
          const ach = ACHIEVEMENTS.find(a => a.id === id);
          if (ach) {
            showToast(`🏆 Achievement Unlocked: ${ach.title}!`);
            try { confetti({ particleCount: 70, spread: 60, origin: { y: 0.7 } }); } catch (e) {}
          }
        }
      };

      const markStepComplete = (modId, stepName) => {
        setProgress(prev => {
          const mod = prev[modId] || { learn: false, animation: false, task: false, terminal: false, quiz: false, completed: false, quizScore: 0 };
          const updated = { ...mod, [stepName]: true };
          updated.completed = updated.learn && updated.animation && updated.task && updated.terminal && updated.quiz;
          const nextProg = { ...prev, [modId]: updated };

          const doneCount = Object.values(nextProg).filter(m => m.completed).length;
          if (doneCount >= 1) unlockAchievement("first_module");
          if (doneCount >= 5) unlockAchievement("halfway");
          if (doneCount >= 10) unlockAchievement("master");

          return nextProg;
        });
      };

      const setQuizScore = (modId, score) => {
        setProgress(prev => {
          const mod = prev[modId] || {};
          const updated = { ...mod, quiz: true, quizScore: score };
          updated.completed = updated.learn && updated.animation && updated.task && updated.terminal && updated.quiz;

          if (score === 100) unlockAchievement("quiz_ace");
          return { ...prev, [modId]: updated };
        });
      };

      const getModulePercent = (modId) => {
        const m = progress[modId];
        if (!m) return 0;
        const done = [m.learn, m.animation, m.task, m.terminal, m.quiz].filter(Boolean).length;
        return Math.round((done / 5) * 100);
      };

      const getOverallPercent = () => {
        const sum = MODULES_DATA.reduce((acc, m) => acc + getModulePercent(m.id), 0);
        return Math.round(sum / MODULES_DATA.length);
      };

      const activeModule = MODULES_DATA.find(m => m.id === currentModuleId);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Toast notification */}
          {toast && (
            <div className="fixed top-20 right-6 z-50 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold text-xs px-4 py-3 rounded-2xl shadow-2xl border border-purple-400/30 flex items-center gap-2">
              <i data-lucide="sparkles" className="w-4 h-4"></i> {toast}
            </div>
          )}

          {/* Header Navbar */}
          <header className="h-16 border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-30 flex items-center justify-between px-4 sm:px-6">
            <div className="flex items-center gap-3">
              <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-2 text-slate-400 hover:text-white md:hidden">
                <i data-lucide="menu" className="w-5 h-5"></i>
              </button>
              <div onClick={() => setCurrentModuleId(null)} className="flex items-center gap-2.5 cursor-pointer">
                <div className="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold shadow-lg shadow-blue-500/20">
                  <i data-lucide="cpu" className="w-5 h-5"></i>
                </div>
                <div>
                  <span className="font-extrabold text-sm sm:text-base tracking-tight text-white flex items-center gap-1.5">
                    OS Virtual Lab <span className="text-[10px] font-mono bg-blue-500/20 text-blue-400 border border-blue-500/30 px-1.5 py-0.5 rounded">v2.0</span>
                  </span>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-4">
              <div className="hidden sm:flex items-center gap-3 bg-slate-900 border border-slate-800 px-3.5 py-1.5 rounded-full text-xs font-mono">

    // -------------------------------------------------------------
    // TOPIC PAGE VIEW (5 STEPS TIMELINE)
    // -------------------------------------------------------------
    function TopicPageView({ moduleData, currentStep, setCurrentStep, progress, getModulePercent, markStepComplete, setQuizScore, onBackToDashboard }) {
      const pct = getModulePercent(moduleData.id);
      const modProgress = progress[moduleData.id] || {};

      useEffect(() => {
        if (currentStep === 1) markStepComplete(moduleData.id, 'learn');
      }, [currentStep, moduleData.id]);

      const steps = [
        { id: 1, name: 'learn', label: 'Step 1: Learn' },
        { id: 2, name: 'animation', label: 'Step 2: Animation' },
        { id: 3, name: 'task', label: 'Step 3: Task' },

        { id: 5, name: 'quiz', label: 'Step 5: Quiz' }
      ];

      return (
        <div className="space-y-8 pb-12">
          {/* Breadcrumb */}
          <div className="flex items-center justify-between text-xs font-mono">
            <button onClick={onBackToDashboard} className="text-slate-400 hover:text-white flex items-center gap-2">
              ← Back to Dashboard
            </button>
            <span className="text-blue-400 font-bold">{pct}% Completed</span>
          </div>

          {/* Module Header */}
          <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-2">

                <p className="text-slate-400 text-xs mt-1">{moduleData.shortDesc}</p>
              </div>
              {modProgress.completed && (
                <span className="px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-mono font-bold">
                  ✓ Module Completed
                </span>
              )}
            </div>
          </div>

          {/* 5 Steps Timeline Navigation */}
          <div className="bg-slate-900 border border-slate-800 p-2 rounded-2xl overflow-x-auto">
            <div className="flex items-center min-w-[600px] justify-between">
              {steps.map(step => {
                const isCurrent = currentStep === step.id;
                const isDone = modProgress[step.name];
                return (
                  <button
                    key={step.id}
                    onClick={() => setCurrentStep(step.id)}
                    className={`flex-1 px-3 py-2.5 rounded-xl text-xs font-semibold transition text-center ${
                      isCurrent ? 'bg-blue-600 text-white shadow-lg' : isDone ? 'text-emerald-400 hover:bg-slate-800' : 'text-slate-400 hover:bg-slate-800'

              })}

            {currentStep === 1 && <LearnStep moduleData={moduleData} />}
            {currentStep === 2 && <AnimationStep moduleId={moduleData.id} onInteract={() => markStepComplete(moduleData.id, 'animation')} />}
            {currentStep === 3 && <TaskStep moduleData={moduleData} onComplete={() => markStepComplete(moduleData.id, 'task')} />}
            {currentStep === 4 && <TerminalStep moduleId={moduleData.id} onComplete={() => markStepComplete(moduleData.id, 'terminal')} />}
            {currentStep === 5 && <QuizStep moduleData={moduleData} setQuizScore={setQuizScore} onComplete={() => markStepComplete(moduleData.id, 'quiz')} />}

          {/* Footer Back/Next controls */}
          <div className="flex items-center justify-between border-t border-slate-800 pt-6">
            <button
              onClick={() => setCurrentStep(Math.max(1, currentStep - 1))}
              disabled={currentStep === 1}
              className="px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 text-xs font-semibold disabled:opacity-40"
            >
              ← Previous Step
            </button>
            <button
              onClick={() => {
                if (currentStep < 5) {
                  const name = steps.find(s => s.id === currentStep)?.name;
                  if (name) markStepComplete(moduleData.id, name);
                  setCurrentStep(currentStep + 1);
                }
              }}
              disabled={currentStep === 5}
              className="px-5 py-2.5 rounded-xl bg-blue-600 text-white text-xs font-bold disabled:opacity-40 shadow-lg"

                <div key={idx} className="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-1">

    // -------------------------------------------------------------
    // STEP 2: ANIMATION / VISUAL SIMULATION
    // -------------------------------------------------------------
    function AnimationStep({ moduleId, onInteract }) {
      return (
        <div className="space-y-4">
          <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl text-xs text-slate-400 font-mono flex justify-between">
            <span>💡 Interactive Simulation Mode</span>
            <span className="text-blue-400">Adjust parameters & step live</span>
          </div>

          {moduleId === 'process-management' && <ProcessSim onInteract={onInteract} />}
          {moduleId === 'cpu-scheduling' && <CpuSim onInteract={onInteract} />}
          {moduleId === 'threads' && <ThreadSim onInteract={onInteract} />}
          {moduleId === 'process-sync' && <SyncSim onInteract={onInteract} />}
          {moduleId === 'deadlocks' && <DeadlockSim onInteract={onInteract} />}
          {moduleId === 'memory-management' && <MemorySim onInteract={onInteract} />}
          {moduleId === 'paging' && <PagingSim onInteract={onInteract} />}
          {moduleId === 'page-replacement' && <PageReplaceSim onInteract={onInteract} />}
          {moduleId === 'disk-scheduling' && <DiskSim onInteract={onInteract} />}
          {moduleId === 'file-systems' && <FileSystemSim onInteract={onInteract} />}
        </div>
      );
    }

    // Process State Sim
    function ProcessSim({ onInteract }) {
      const [procs, setProcs] = useState([
        { id: 'P1', state: 'Ready' },
        { id: 'P2', state: 'Running' },
        { id: 'P3', state: 'Waiting' }
      ]);
      const states = ['New', 'Ready', 'Running', 'Waiting', 'Terminated'];

      const moveProc = (id, target) => {
        setProcs(prev => prev.map(p => p.id === id ? { ...p, state: target } : p));
        if (onInteract) onInteract();
      };

      return (
        <div className="grid grid-cols-1 sm:grid-cols-5 gap-3">
          {states.map(s => {
            const list = procs.filter(p => p.state === s);
            return (
              <div key={s} className="bg-slate-900 border border-slate-800 p-3 rounded-xl min-h-[220px]">
                <div className="font-semibold text-xs text-slate-300 border-b border-slate-800 pb-2 mb-2 flex justify-between">
                  <span>{s}</span>
                  <span className="font-mono text-blue-400">{list.length}</span>
                </div>
                <div className="space-y-2">
                  {list.map(p => (
                    <div key={p.id} className="bg-slate-800 p-2 rounded text-xs space-y-1 font-mono">
                      <div className="font-bold text-slate-200">{p.id}</div>
                      <select
                        value={p.state}
                        onChange={(e) => moveProc(p.id, e.target.value)}
                        className="bg-slate-900 border border-slate-700 text-[10px] rounded p-1 w-full text-slate-300"
                      >
                        {states.map(st => <option key={st} value={st}>{st}</option>)}
                      </select>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // CPU Scheduling Sim
    function CpuSim({ onInteract }) {
      const [algo, setAlgo] = useState('FCFS');
      const procs = [
        { id: 'P1', arrival: 0, burst: 6 },
        { id: 'P2', arrival: 1, burst: 4 },
        { id: 'P3', arrival: 2, burst: 8 }
      ];

      return (
        <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4 font-mono text-xs">
          <div className="flex items-center gap-3">
            <span className="text-slate-300 font-bold">Algorithm:</span>
            <select value={algo} onChange={(e) => setAlgo(e.target.value)} className="bg-slate-800 border border-slate-700 text-blue-400 p-1.5 rounded">
              <option value="FCFS">FCFS (First-Come First-Served)</option>
              <option value="SJF">Shortest Job First (SJF)</option>
              <option value="RR">Round Robin (RR)</option>
            </select>
          </div>

          <div className="space-y-2">
            <div className="text-slate-400">Generated Gantt Chart:</div>
            <div className="flex border border-slate-700 rounded h-12 overflow-hidden text-center text-white font-bold">
              <div className="w-1/3 bg-blue-600 border-r border-blue-400 flex items-center justify-center">P1 (0-6ms)</div>
              <div className="w-1/4 bg-emerald-600 border-r border-emerald-400 flex items-center justify-center">P2 (6-10ms)</div>
              <div className="w-5/12 bg-purple-600 flex items-center justify-center">P3 (10-18ms)</div>
            </div>
          </div>
          <div className="text-emerald-400 font-bold">Avg Waiting Time: 7.33 ms</div>
        </div>
      );
    }

    // Thread Sim
    function ThreadSim({ onInteract }) {
      const [counter, setCounter] = useState(0);
      const [useLock, setUseLock] = useState(false);

      const runRace = () => {
        setCounter(0);
        let c = 0;
        let lock = false;
        for (let i = 0; i < 10; i++) {
          if (!useLock || !lock) {
            if (useLock) lock = true;
            c += 1;
            if (useLock) lock = false;
          }
        }
        setCounter(c + (useLock ? 10 : Math.floor(Math.random() * 3)));
        if (onInteract) onInteract();
      };

      return (
        <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4 text-xs font-mono">
          <div className="flex items-center justify-between">
            <button onClick={runRace} className="px-4 py-2 bg-cyan-600 text-white font-bold rounded-lg">Run Concurrency Test</button>
            <label className="flex items-center gap-2 cursor-pointer text-slate-300">
              <input type="checkbox" checked={useLock} onChange={(e) => setUseLock(e.target.checked)} className="accent-cyan-500" />
              Enable Mutex Lock
            </label>
          </div>
          <div className="text-lg text-cyan-400 font-bold">Shared Counter = {counter}</div>
        </div>
      );
    }

    // Sync Sim
    function SyncSim({ onInteract }) {
      const [buffer, setBuffer] = useState(['Item-1', 'Item-2']);
      const produce = () => {
        if (buffer.length < 5) {
          setBuffer([...buffer, `Item-${buffer.length + 1}`]);
          if (onInteract) onInteract();
        }
      };
      const consume = () => {
        if (buffer.length > 0) {
          setBuffer(buffer.slice(1));
          if (onInteract) onInteract();
        }
      };

      return (
        <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4 text-xs font-mono">
          <div className="flex gap-2">
            <button onClick={produce} className="px-3 py-1.5 bg-blue-600 text-white rounded">Produce Item</button>
            <button onClick={consume} className="px-3 py-1.5 bg-purple-600 text-white rounded">Consume Item</button>
          </div>
          <div className="grid grid-cols-5 gap-2">
            {Array.from({ length: 5 }).map((_, idx) => (
              <div key={idx} className={`h-16 rounded border flex items-center justify-center ${buffer[idx] ? 'bg-emerald-950 border-emerald-500 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-600'}`}>
                {buffer[idx] || 'Empty'}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Deadlock Sim
    function DeadlockSim({ onInteract }) {
      const [safe, setSafe] = useState(true);
      return (
        <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4 text-xs font-mono">
          <button onClick={() => { setSafe(!safe); if (onInteract) onInteract(); }} className="px-4 py-2 bg-amber-600 text-white font-bold rounded-lg">
            {safe ? "Inject Deadlock Cycle" : "Clear Deadlock"}
          </button>
          <div className={`p-3 rounded border font-bold ${safe ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-300' : 'bg-rose-950/40 border-rose-500/50 text-rose-300'}`}>
            {safe ? "SYSTEM SAFE: Sequence P1 → P3 → P2" : "DEADLOCK DETECTED: Cycle P1 → R1 → P2 → R2 → P1"}
          </div>
        </div>
      );
    }

    // Memory Sim
    function MemorySim({ onInteract }) {
      const [strat, setStrat] = useState('best');
      return (
        <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4 text-xs font-mono">
          <div className="flex items-center gap-3">
            <span>Strategy:</span>
            <select value={strat} onChange={(e) => setStrat(e.target.value)} className="bg-slate-800 border border-slate-700 text-rose-400 p-1 rounded">
              <option value="first">First-Fit</option>
              <option value="best">Best-Fit</option>
              <option value="worst">Worst-Fit</option>
            </select>
          </div>
          <div className="space-y-2">
            <div className="bg-slate-950 p-2 rounded border border-slate-800 flex justify-between">
              <span>Block 1 (500KB)</span> <span className="text-rose-400">Allocated P1 (212KB) - Best-Fit</span>
            </div>
          </div>
        </div>
      );
    }

    // Paging Sim
    function PagingSim({ onInteract }) {
      return (
        <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-3 text-xs font-mono">
          <div className="text-indigo-400 font-bold">Logical Address: 2448 bytes</div>
          <div>Page Number (p) = 2, Offset (d) = 400</div>
          <div>Page Table Lookup: Page 2 → Frame 5</div>
          <div className="text-emerald-400 font-bold">Physical Address = (5 * 1024) + 400 = 5520 bytes (TLB HIT)</div>
        </div>
      );
    }

    // Page Replacement Sim
    function PageReplaceSim({ onInteract }) {
      return (
        <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-3 text-xs font-mono">
          <div className="text-teal-400 font-bold">Reference String: 7, 0, 1, 2, 0, 3</div>
          <div className="grid grid-cols-6 gap-2 text-center">
            {['7', '0', '1', '2', '0', '3'].map((item, idx) => (
              <div key={idx} className="bg-slate-950 p-2 rounded border border-slate-800">
                <div className="text-teal-400 font-bold">{item}</div>
                <div className="text-[10px] text-rose-400 mt-1">FAULT</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Disk Sim
    function DiskSim({ onInteract }) {
      return (
        <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-3 text-xs font-mono">
          <div className="text-sky-400 font-bold">Disk Head at Cylinder 50</div>
          <div>Request Queue: 82 → 170 → 43</div>
          <div className="text-emerald-400 font-bold">SSTF Seek Path: 50 → 43 → 82 → 170 (134 Cylinders)</div>
        </div>
      );
    }

    // File System Sim
    function FileSystemSim({ onInteract }) {
      return (
        <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-3 text-xs font-mono">
          <div className="text-violet-400 font-bold">File: doc.pdf (Indexed Allocation)</div>
          <div>Inode Identifier: #14</div>
          <div>Index Block Sector: #5 → Pointers: [2, 7, 9]</div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // STEP 3: TASK
    // -------------------------------------------------------------
    function TaskStep({ moduleData, onComplete }) {
      const { task } = moduleData;
      const [selected, setSelected] = useState(null);
      const [submitted, setSubmitted] = useState(false);

      const handleSubmit = () => {
        if (selected === null) return;
        setSubmitted(true);
        if (selected === task.correctAnswer) onComplete();
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-3">
            <h3 className="font-bold text-white text-base">{task.title}</h3>
            <p className="text-slate-400 text-xs">{task.instructions}</p>
            <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-slate-200 text-sm">{task.question}</div>
          </div>

          <div className="space-y-3">
            {task.options.map((opt, idx) => {
              let style = "bg-slate-900 border-slate-800 text-slate-300";
              if (selected === idx) style = "bg-blue-950 border-blue-500 text-blue-300";
              if (submitted) {
                if (idx === task.correctAnswer) style = "bg-emerald-950 border-emerald-500 text-emerald-300 font-bold";
                else if (selected === idx) style = "bg-rose-950 border-rose-500 text-rose-300";
              }

              return (
                <button
                  key={idx}
                  disabled={submitted}
                  onClick={() => setSelected(idx)}
                  className={`w-full p-4 rounded-xl border text-left text-sm transition ${style}`}
                >
                  {opt}
                </button>
              );
            })}
          </div>

          {!submitted ? (
            <button onClick={handleSubmit} disabled={selected === null} className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl disabled:opacity-50">
              Submit Task Answer
            </button>
          ) : (
            <div className={`p-4 rounded-xl border text-xs font-mono ${selected === task.correctAnswer ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-300' : 'bg-rose-950/40 border-rose-500/40 text-rose-300'}`}>
              {task.explanation}
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------
    // STEP 4: TERMINAL CLI SHELL
    // -------------------------------------------------------------
    function TerminalStep({ moduleId, onComplete }) {
      const [input, setInput] = useState('');
      const [history, setHistory] = useState([
        { type: 'sys', text: 'Simulated OS CLI Shell v2.4' },
        { type: 'sys', text: 'Type "help" to view all supported virtual OS commands.' }
      ]);

      const handleCmd = (cmdStr) => {
        const cmd = cmdStr.trim().toLowerCase();
        if (!cmd) return;

        let out = [];
        if (cmd === 'help') out = ['Available commands: help, cpu schedule, memory, disk, deadlock, paging, sync, clear'];
        else if (cmd === 'cpu schedule') out = ['[CPU Scheduler] Gantt Chart computed. Avg WT = 7.33 ms'];
        else if (cmd === 'memory') out = ['[Memory] Allocated P1 (212KB) into Block 1 (500KB) via Best-Fit.'];
        else if (cmd === 'disk') out = ['[Disk] SSTF Head Path: 50 -> 43 -> 82 -> 170. Total Seek: 134 Cylinders.'];
        else if (cmd === 'deadlock') out = ['[Banker] Safe Sequence found: P1 -> P3 -> P2. No Deadlock.'];
        else if (cmd === 'clear') { setHistory([]); setInput(''); return; }
        else out = [`zsh: command not found: ${cmd}. Type "help".`];

        setHistory(prev => [...prev, { type: 'user', text: `$ ${cmd}` }, ...out.map(t => ({ type: 'out', text: t }))]);
        setInput('');
        if (onComplete) onComplete();
      };

      return (
        <div className="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden font-mono text-xs shadow-2xl">
          <div className="bg-slate-900 px-4 py-3 border-b border-slate-800 text-slate-400 font-semibold flex justify-between">
            <span>simulated-os-shell ~ zsh</span>
            <button onClick={() => setHistory([])} className="hover:text-white">Clear</button>
          </div>

          <div className="p-4 h-72 overflow-y-auto space-y-1">
            {history.map((h, i) => (
              <div key={i} className={h.type === 'user' ? 'text-blue-400 font-bold' : h.type === 'sys' ? 'text-slate-500 italic' : 'text-emerald-400 pl-2'}>
                {h.text}
              </div>
            ))}
          </div>

          <form onSubmit={(e) => { e.preventDefault(); handleCmd(input); }} className="bg-slate-900 p-3 border-t border-slate-800 flex gap-2">
            <span className="text-blue-400 font-bold">$</span>
            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              placeholder="Try 'help', 'cpu schedule', 'memory', 'disk'..."
              className="w-full bg-transparent outline-none text-slate-100 placeholder-slate-600"
            />
          </form>
        </div>
      );
    }

    // -------------------------------------------------------------
    // STEP 5: QUIZ
    // -------------------------------------------------------------
    function QuizStep({ moduleData, setQuizScore, onComplete }) {
      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const questions = moduleData.quiz;

      const submitQuiz = () => {
        let correct = 0;
        questions.forEach(q => {
          if (answers[q.id] === q.correctIndex) correct++;
        });
        const score = Math.round((correct / questions.length) * 100);
        setSubmitted(true);
        setQuizScore(moduleData.id, score);
        if (onComplete) onComplete();
        if (score === 100) {
          try { confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } }); } catch (e) {}
        }
      };

      return (
        <div className="space-y-6">
          {questions.map((q, idx) => (
            <div key={q.id} className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-3">
              <h4 className="font-semibold text-slate-200 text-sm">{idx + 1}. {q.question}</h4>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                {q.options.map((opt, oIdx) => {
                  let style = "bg-slate-950 border-slate-800 text-slate-300";
                  if (answers[q.id] === oIdx) style = "bg-purple-950 border-purple-500 text-purple-300 font-bold";
                  if (submitted) {
                    if (oIdx === q.correctIndex) style = "bg-emerald-950 border-emerald-500 text-emerald-300 font-bold";
                    else if (answers[q.id] === oIdx) style = "bg-rose-950 border-rose-500 text-rose-300";
                  }
                  return (
                    <button
                      key={oIdx}
                      disabled={submitted}
                      onClick={() => setAnswers({ ...answers, [q.id]: oIdx })}
                      className={`p-3 rounded-xl border text-left text-xs transition ${style}`}
                    >
                      {opt}
                    </button>
                  );
                })}
              </div>
              {submitted && <div className="text-xs text-slate-400 bg-slate-950 p-2.5 rounded font-sans leading-relaxed">{q.explanation}</div>}
            </div>
          ))}

          {!submitted ? (
            <button onClick={submitQuiz} disabled={Object.keys(answers).length < questions.length} className="w-full py-3 bg-purple-600 text-white font-bold rounded-xl disabled:opacity-50">
              Submit Quiz
            </button>
          ) : (
            <div className="bg-slate-900 border border-purple-500/40 p-6 rounded-2xl text-center space-y-2">
              <div className="text-xl font-bold text-white font-mono">Quiz Submitted!</div>
              <button onClick={() => setSubmitted(false)} className="px-4 py-2 bg-slate-800 text-slate-200 text-xs font-semibold rounded-xl">Retake Quiz</button>
            </div>
          )}
        </div>
      );
    }

    // Render App into DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
